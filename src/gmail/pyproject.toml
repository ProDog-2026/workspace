[project]
name = "prodog-gmail"
version = "0.1.0"
description = "ProDog Gmail read-only OAuth and mail ingestion module"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "cryptography>=44,<49",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1,<2",
  "prodog-sast",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv.sources]
prodog-sast = { path = "../detector", editable = true }
