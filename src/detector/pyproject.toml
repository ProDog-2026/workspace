[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "prodog-sast"
version = "0.1.0"
description = "ML-only static detector for prompt injection in email"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.4,<2",
  "scikit-learn==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
prodog-sast = "prodog_sast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
